services:
  server:
    restart: always
    build: .
    container_name: pc-control-server
    # Host networking is required for mDNS discovery
    network_mode: host
    environment:
      # Pass the host's DISPLAY variable for X11 control
      - DISPLAY=${DISPLAY}
      # Point to the mounted Xauthority file
      - XAUTHORITY=/root/.Xauthority
    # Load environment variables (WS_PORT, SERVER_PASSWORD) from .env
    env_file:
      - .env
    # Mount X11 socket and Authority file for mouse/keyboard control
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:ro
      - /usr/bin/ydotool:/usr/local/bin/ydotool:ro
      - /usr/bin/ydotoold:/usr/local/bin/ydotoold:ro
    # Required by ydotool for Wayland input injection.
    # If this device is missing on the host, run: sudo modprobe uinput
    devices:
      - /dev/uinput:/dev/uinput
