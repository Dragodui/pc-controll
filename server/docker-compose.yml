services:
  server:
    restart: always
    build: .
    container_name: pc-control-server
    # Host networking is required for mDNS discovery
    network_mode: host
    user: "${PC_CONTROL_UID:-1000}:${PC_CONTROL_GID:-1000}"
    group_add:
      - "${PC_CONTROL_INPUT_GID:-104}"
    environment:
      - PCINPUT_BACKEND=linux-uinput
      - XDG_RUNTIME_DIR=/tmp/xdg-runtime
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
    # Load environment variables (WS_PORT, SERVER_PASSWORD) from .env
    env_file:
      - .env
    # Required by the native Linux uinput backend.
    # If this device is missing on the host, run: sudo modprobe uinput.
    # If permission is denied, set PC_CONTROL_INPUT_GID to the host group id owning /dev/uinput.
    devices:
      - /dev/uinput:/dev/uinput
    volumes:
      - ${XDG_RUNTIME_DIR:-/run/user/1000}/${WAYLAND_DISPLAY:-wayland-0}:/tmp/xdg-runtime/${WAYLAND_DISPLAY:-wayland-0}
