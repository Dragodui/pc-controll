name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    name: server (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            os: ubuntu-latest
            targets: linux desktop-linux
            artifacts: |
              server/dist/pc-control-server-linux-amd64
              server/dist/pc-control-desktop-linux-amd64
          - name: windows-amd64
            os: ubuntu-latest
            targets: windows desktop-windows
            artifacts: |
              server/dist/pc-control-server-windows-amd64.exe
              server/dist/pc-control-desktop-windows-amd64.exe
          - name: darwin-arm64
            os: macos-latest
            targets: darwin desktop-darwin
            artifacts: |
              server/dist/pc-control-server-darwin-arm64
              server/dist/pc-control-desktop-darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install Linux GL/X11 headers (Fyne)
        if: matrix.name == 'linux-amd64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev libxkbcommon-dev
      - name: Install mingw-w64
        if: matrix.name == 'windows-amd64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
      - name: Build
        working-directory: server
        run: make ${{ matrix.targets }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  apk:
    name: android apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest ships the Android SDK (ANDROID_HOME set); Gradle fetches platforms/NDK on demand.
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        working-directory: server
        run: make apk
      - uses: actions/upload-artifact@v4
        with:
          name: pc-control-client.apk
          path: server/dist/pc-control-client.apk
          if-no-files-found: error

  release:
    name: github release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, apk]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
